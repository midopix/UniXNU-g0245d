[device]
name = "g0245d"
soc = "MSM8996"
os_profile = "ipados-17.7.11-21H461"
summary = "Gree G0245D (格力手机·色界) port: Snapdragon 820, 4 GB LPDDR4, 64 GB UFS 2.0, Adreno 530, MDP5. Hardware inventory complete from the stock QFIL package (board.dtb, boot.img, rawprogram XML, firmware blobs); repository bootstrap done; no host build or device observation yet."

