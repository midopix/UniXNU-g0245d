configuration = ["kernel_args carries console=ttyHSL0,115200,n8 for the serial stage.", "No serial readback on the retail unit: the BLSP2 UART2 pads are not broken out, so the panel, storage and USB are the only channels."]
procedure = ["Use the screen as the primary observation channel, CrashLogDxe for post-mortem data, and add the Advanced Logger exporter only once the menu is operable."]
findings = [
  "The Advanced Logger path is not available yet, and it would not help while the keys are dead. AdvLoggerPkg, MsGraphicsPkg/Library/QrEncoderLib and UniXNUPkg/Driver/AdvancedLogDxe all exist in the tree, but no Qualcomm platform in Mu-Silicium wires AdvancedLogger in, Msm8996Pkg has no AdvancedLoggerDxe or PcdUniXNUDeviceModel, and selecting Tools -> Advanced Logger is a menu action. The QR export removes the need to photograph text, not the need for working input; the menu keys were the same EVT_TIMER consumers that the timer bug silenced.",
  "CrashLogDxe already implements the storage channel from the log-capture guide: on any synchronous abort or SError it snapshots the general registers, the exception syndrome and a frame-pointer backtrace, writes a CRSH-magic record to a 64 KiB region at the tail of userdata and cold-resets, so the record can be pulled from Android over adb without a serial port.",
  "The screen is the live channel during stage 2. BootMark0..7 mark progress through the DXE dispatch, DisplayDiagDxe owns the panel, and KeyProbeDxe renders a per-key strip; the v99 menu diagnostic line reports driver count, CPU, HardwareInterrupt, TimerArch, interrupt state and the CntPct delta over a fixed busy loop, which separates a dead timer from a dead GIC.",
]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["Device availability not established; serial line wiring from the service manual.", "QR log export stays blocked until the platform gains an Advanced Logger and the menu accepts input; a candidate path is to make the exporter start without a menu action, which the current AdvancedLogDxe does not do."]
next_action = ["Flash v101 and open Tools -> Advanced Logger. The logger is wired but nothing on the device has confirmed it yet: an empty Tools menu means AdvancedLogDxe never dispatched (its depex is gAdvancedLoggerProtocolGuid, installed only by DxeCore's AdvancedLoggerLib constructor), and a QR page that will not scan means the log buffer is empty or unmapped. Record the first real log capture in this area before removing KeyProbeDxe."]
