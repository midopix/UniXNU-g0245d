inputs = [
  "Serial console confirmed: BLSP2 UART2 @ 0x75b0000, SPI 114 (0x72), status ok in the stock DTS; cmdline console=ttyHSL0,115200,n8.",
  "USB Type-C debug cable; vmlinux (193 MB with symbols) available for offline analysis of the stock kernel.",
