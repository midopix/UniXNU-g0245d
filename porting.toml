schema_version = 1

[device]
name = "g0245d"
soc = "MSM8996"
os_profile = "ipados-17.7.11-21H461"
summary = "Gree G0245D (格力手机·色界) port: Snapdragon 820, 4 GB LPDDR4, 64 GB UFS 2.0, Adreno 530, MDP5. Stage 1 is closed: the msm8996 Mu-Silicium platform in uefi-g0245d builds a byte-exact 0x300000 SILICIUM_UEFI.fd, BootShim packs it into a v0 boot image, and the image boots on hardware to the UniXNU menu with a live GOP framebuffer. Current blocker is the timer: PcdArmArchTimerIntrNum carried the device-tree PPI number instead of the GIC INTID, so no timer event ran and both the BBS countdown and KeypadDxe debounce went silent; the fix (29/30/27/26) is built as v100 and awaits a device flash. Kernel and system materials are downloaded and pin-verified; the five board XNU patches are the remaining gap."

[[area]]
id = "configuration"
status = "in-progress"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".gitignore", "README.md"]
inputs = [
  "Stock QFIL package G0245D_Gree_user_QFIL_images.zip (2.6 GB) extracted: 573 files, incl. vmlinux 193 MB with symbols, boot.img, xbl.elf, M8996AAAAAAAAQ1234.elf, prog_ufs_firehose_8996_ddr.elf, NON-HLOS.bin 83 MB, splash.img, rawprogram_unsparse*.xml, gpt_main*.bin.",
  "Mainline Linux msm8996.dtsi supplies CPU/GIC/UFS/GPU/MDP5/SMMU resources (pinned in soc.toml).",
  "UniXNU format 2 device template and sheng reference repository reviewed.",
]
configuration = [
  "board.toml selects soc=msm8996, os_profile=ipados-17.7.11-21H461, payload volume G0245D, dram_size 0x100000000, chip_id 820.",
  "dts/g0245d.dts includes msm8996.dtsi, 4 GB memory at 0x80000000, cpu0-only stage 1, real splash_region 0x83401000/0x23ff000.",
  "configs/g0245d_defconfig enables the stage 1 minimal kernel set.",
  "kernel_args extended with console=ttyHSL0,115200,n8 (stock cmdline, BLSP2 UART2).",
]
procedure = [
  "Created UniXNU-msm8996-common (soc.toml, dts/msm8996.dtsi, configs, patches series).",
  "Created this repository from examples/device with board values replaced.",
  "Extracted board.dtb from boot.img and transcribed board facts into dts/ and porting.toml.",
]
findings = [
  "MSM8996 GICv3 uses #interrupt-cells = <3> (SM8550 uses 4): ArmCpu 3-cell path must be verified before enabling secondary CPUs.",
  "ShengUfs (UFS 3.x/4.x), Adreno740/AdrenoMetal (A7xx), DPU display and GENI serial do not cover MSM8996; new components are required (NativeUfs8996, Adreno530, Mdp5, BlspI2c).",
  "Stock kernel is Linux 3.18.20-perf (GCC 4.9, 2018-11-16) — a vendor CAF tree, not mainline; board.dtb is the authoritative hardware description.",
  "The firmware side does not come from the UniXNU tree for this board: Mu-Silicium has no msm8996 silicon package, so the platform lives in the separate uefi-g0245d repository as Platforms/Gree/g0245dPkg and is consumed through [firmware] in board.toml. board.toml keeps dsc, fd and packages pointing at that overlay.",
  "Host build is Linux, not Windows. The tree uses CLANGPDB with LLVM/lld 21.1.8 everywhere; DeviceBuild.py:166 overrides Conf/target.txt, so a toolchain switch that only edits target.txt produces a silently stale FD under RELEASE_CLANGDWARF (see docs/pitfalls.md).",
]
completion = [
  "SoC feed pinned to a reviewed commit; status shows the intended overrides and patch order; no REQUIRED_ placeholders remain.",
]
limits = [
  "ShengUfs/Adreno740/Mdp5/BlspI2c-style components for MSM8996 do not exist upstream, so the component list stays at the stage 1 set until they do.",
  "The board package is consumed as an overlay on a pinned Mu-Silicium checkout; uefi-g0245d itself is not a full EDK II tree.",
]
next_action = [
  "Flash boot-noramdisk.img (612 KiB, stock kernelcache + our ADT) to see how far XNU gets; expect an early panic until the five device patches exist.",
  "Build the XNU toolchain on a host with more than two cores: scripts/linux/setup-toolchain.py needs the LLVM source unpacked (126k files) plus a Release+Assertions build.",
  "Author the five device patches (gic-v3-3cell, blsp-qup-v2, smmu-v2, ufs-2.0, mdp5-dsi-video); patches/xnu/series lists them but no file exists yet.",
]
evidence = [
  "firmware/extracted/G0245D_Gree_user_QFIL_images/board.dtb (341047 bytes) -> board.dts (16530 lines).",
  "README.md, AGENTS.md, LICENSE, scripts/, patches/xnu/series, REA-WORKFLOW.md added.",
  "uefi-g0245d: PlatformBuild.py runs from Platforms/Gree/g0245dPkg with PACKAGES_PATH covering {uefi}, UniXNUPkg, DarwinBoot and Mu_Basecore; AARCH64 RELEASE_CLANGPDB.",
]

[[area]]
id = "firmware"
status = "in-progress"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/extract-qfil.sh"]
inputs = [
  "QFIL images classified by scripts/extract-files.py (40 files, see proprietary-files.txt + firmware/g0245d-firmware.json): xbl.elf, M8996AAAAAAAAQ1234.elf (+ _SENSOR variant), RPM_AAAAANAAR.elf, prog_ufs_firehose_8996_ddr.elf, NON-HLOS.bin 83 MB, adspso.bin 16 MB, BTFM.bin (BT firmware), G0245D_fs_image_golden_copy_srdsds_mbnautosel_asdiv_1031.img (UFS golden copy), splash.img, boot.img, board.dtb, rawprogram/gpt XMLs, qca_cld_wlan.ko.",
  "boot.img (Android v0): kernel_addr 0x80008000, ramdisk_addr 0x81000000, tags_addr 0x80000100, page_size 4096, cmdline at offset 64.",
  "Board identity: msm-id 0xf6/0x30000 (MSM 8996 v3.0), pmic-id 0x20009/0x2000a, board-id 0x03/0x00.",
]
configuration = ["Record the Mu-Silicium msm8996 platform configuration: [uefi_fd] base/size, boot image parameters, BootShim flags."]
procedure = ["Follow the firmware stage of the porting guide with scripts/extract-files.py; record the actual commands.", "readelf/strings/python header parsing on xbl.elf, M8996AAAAAAAAQ1234.elf, emmc_appsboot.mbn, splash.img (pre-Ghidra layout pass, 2026-10-25)."]
findings = [
  "Partition map from rawprogram_unsparse*.xml (4096 B sectors): rpm@s6, xbl@s6(xbl.elf), tz@s262, hyp@s1286, fsg@s1542, sec@s2054, pmic@s2058, modem@s2314+24320s (NON-HLOS.bin, 95 MiB), dsp@s26634 (adspso.bin), mdtp@s30986, boot@s39690+16384s, misc@s73736, devcfg@s74120, aboot@s39178+256s (emmc_appsboot.mbn = the LK-based Android Bootloader), persist@s8+1173s, cache@s8200, system@s56074, userdata@s74312, splash@s859852+8356s, lksecapp@s859147, keymaster@s859211, cmnlib@s859467, cmnlib64@s859595, bluetooth@s858891 (BTFM.bin), devinfo@s858890, weakchg@s868720, weakbat@s871792.",
  "Boot chain: PBL -> xbl.elf (XBL core @0x6208000, entry 0x6213de0; DDR training RWE @0x80200000/0xf0000; IMEM LOADs @0x21e000/0x207000/0x217800) -> emmc_appsboot.mbn (LK + aboot, aboot partition) -> boot.img kernel.",
  "M8996AAAAAAAAQ1234.elf is a combined XBL+QURT(SLPI) image (entry 0xb0100000; segments 0xb0000000..0xb0429000; contains QURT kernel strings) and is NOT programmed by any rawprogram XML - QFIL flat-build artifact only.",
  "emmc_appsboot.mbn (757884 B): standard Qualcomm MBN (ELF32 header describing 64-bit segments - readelf misparses it as ELF64). e_entry = 0x91600000; main PT_LOAD: file 0x8000..0xb907c -> 0x91600000..0x916b107c (filesz 0xb107c, memsz 0xc4478, RWX); no signature trailer; address mapping vaddr = 0x91600000 + (file_offset - 0x8000), verified by 946 string-pointer literals (e.g. '/G0245D_shared/mdp5.c'). Contains boot_verifier.c strings, VERIFIED_BOOT_SIG, 'Android Bootloader - UART_DM Initialized!!!', ANDROID! magic at file 0x7e168 (vaddr 0x91676168), DTB patching strings, bootselect A/B support; EMMC_BOOT_IMG_HEADER_ADDR = 0x8F6FF000 (public MSM8996 LK constant).",
  "splash.img format decoded: 1536-byte header 'SPLASH!!' (width=1080, height=1920 as uint32 LE at +8/+12) + exactly 3 RGB888 frames of 6220800 B (18662400 B payload, 18663936 B total). The MDP/ABL renders frame 0 into cont_splash_mem@0x83401000.",
  "vmlinux (Linux 3.18.20-perf, AArch64 EXEC, entry 0xffffffc000080000) symbol pass: cnss_pci.c (PCIe WLAN), ufs_qcom phy init/vreg helpers, mdss_mdp.c, kgsl (Adreno), synaptics_dsx_i2c + synaptics_rmi4_i2c, fts_ts (both touch drivers compiled; DTS selects synaptics@20), panel driver candidates nt35596/tm23_g..tm30_g compiled but DTS selects ft8716.",
  "boot.img kernel slot DTB table (2026-10-25): after the gzip stream (8399161 B, decompressing to a 26375904 B ARM64 Image with text_offset 0x80000 (real kernel text at 0x80008000+0x80000=0x80088000, clear of the appended-DTB region 0x80000100-0x800536F7), image_size 0x1b88000, magic 'ARMd') follow 90 concatenated FDTs (330177-349324 B each, 30944820 B total, no table header). The 90 trees are the Qualcomm MSM8996/APQ8096 reference-board family (FLUID, CDP, MTP, LiQUID, DragonBoard, ... variants); FDT#0 is 'MSM 8996 v3.0 FLUID' (msm-id 0xf6/0x30000, board-id 0x03/0x00, pmic-id 0x20009/0x2000a/0/0) and is byte-identical to the standalone board.dtb. aboot strings confirm the matcher: 'ERROR: Couldn't find the suitable DTB!', 'qcom,pmic-id(%d) or qcom,board-id(%d) in device tree is not a multiple of (%d %d)', 'Failed to move/resize dtb buffer', 'Device tree addresses overlap with aboot addresses.'.",
  "xbl.elf XBL/UEFI memory map (string table, 32 entries; embedded __FILE__ path QcomPkg/XBLCore/UefiPlatCfg.c) resolves the firmware DDR carveouts: HLOS 0 0x80100000-0x80200000, XBL's own UEFI FD 0x80200000-0x80300000, Display Reserved 0x80400000-0x80C00000 (8 MB, XBL early framebuffer), HLOS 2 0x84000000-0x85800000, HYP 0x85800000-0x85E00000, SMEM 0x86000000-0x86200000, TZ 0x86400000-0x86600000, Stargate 0x87400000-0x88800000, PIL_REGION 0x88800000-0x90F00000 (135 MB = modem/ADSP/venus/MBA/wlan). No separate fixed GPU (Adreno) carveout exists; GPU memory is carved at runtime via KGSL/PIL inside PIL_REGION - the 'GPU/venus/mba carveout' open item is closed.",
  "SPMI DXE had to be restored from the device's own firmware. `Binaries/g0245d` is a git submodule and the board-side changes live only in that submodule's worktree, so a source-only checkout stops at \"SPMI.inf is not found\". Recovery chain from the QFIL xbl.elf: top-level FV at 0xC0010 -> FFS 9E21FD93-9C72-4C15-8C4B-E77F1DB2D792 -> EFI_SECTION_GUID_DEFINED EE4E5898-3914-4259-9D6E-DC7BD79403CF (LZMA) -> inner FV -> FFS 2A7B4BEF-80CD-49E1-B473-374BA4D673FC, PE32+ AArch64 section, 30240 bytes, DXE_DEPEX 06 08 (TRUE), sha256 95d74428... Two independent paths (hand-written FV walk and rea inspect-artifact) produced byte-identical output. The image is vendor code: it is listed in proprietary-files.txt by hash and stays out of Git.",
  "Firmware build is green on Linux: AARCH64 RELEASE_CLANGPDB, 0058 Images Verified, PROGRESS - Success, exit 0, about 55 s. The FD is exactly 0x300000 bytes. Verifying that new C code reached the FD cannot be done by searching the .fd: FVMAIN sits inside an LZMA GUIDed section, so the only valid check is decompressing that section and comparing the extracted PE32 against the build output (scripts/verify-fd-unixnu.py). Done that way, AARCH64/UniXNU.efi (87040 bytes) is byte-identical to the copy inside the FD.",
]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented reservations."]
limits = [
  "Vendor DXE images (SPMI and friends) are not in Git; a fresh checkout must restore them from the QFIL package into Binaries/g0245d before building (scripts/restore-vendor-dxe.py).",
  "Ghidra must load emmc_appsboot.mbn as raw binary: base 0x91600000, image = file[0x8000:] (Qualcomm MBN ELF32 format, not a corrupt ELF64) — per-Ghidra BootShim contract now captured in the packaging area.",
  "aboot boot_verifier is non-fatal on a locked retail device (unsigned boot.img still boots); unlock skips verification. QFIL/E DL remains the flashing/bypass path if the boot partition is protected.",
  "The menu reports \"drivers 0 loaded\" and \"no boot entry found\" because the FD still lacks the payload discovery chain: UniXNURamDiskDxe, DiskIoDxe and Fat must be added to DSC/FDF before the payload FAT volume can be enumerated (see the payload-discovery checklist in the UEFI firmware guide).",
]
next_action = ["Flash v100 (timer PPI 29/30/27/26) and confirm the countdown advances. Then add UniXNURamDiskDxe + DiskIoDxe + Fat to the DSC/FDF so the payload volume is discovered, and re-enable cpu1..cpu3 behind the 3-cell GIC check."]
evidence = [
  "readelf -h/-l/-S on xbl.elf (17 program headers, no sections) and M8996AAAAAAAAQ1234.elf (8 LOAD segments, entry 0xb0100000).",
  "python struct parse of emmc_appsboot.mbn header + ANDROID! @0x7e168 context; strings grep for boot_verifier/VERIFIED_BOOT_SIG/DTB.",
  "splash.img header decode: 'SPLASH!!' magic, w=1080, h=1920, 3 frames x RGB888 = 18663936 B total.",
  "readelf -sW vmlinux: fts_ts/synaptics_dsx_i2c/cnss_pci/ufs_qcom/mdss_mdp/kgsl symbols; strings: nt35596, tm23_g..tm30_g panel names.",
  "rawprogram_unsparse*.xml full label->filename map (boot/aboot/modem/xbl/splash/...).",
  "xbl.elf strings -t x: 32-entry XBL/UEFI memory map table (QcomPkg/XBLCore/UefiPlatCfg.c); key DDR carveouts HLOS0 0x80100000, UEFI FD 0x80200000, Display Reserved 0x80400000/8MB, HLOS2 0x84000000, HYP 0x85800000, SMEM 0x86000000, TZ 0x86400000, Stargate 0x87400000, PIL_REGION 0x88800000-0x90F00000 (135 MB).",
]

[[area]]
id = "cpu"
status = "in-progress"
components = ["ArmCpu"]
paths = ["dts/g0245d.dts", "configs/g0245d_defconfig"]
inputs = ["4x Kryo 280 (Cortex-A72 class), MPIDR 0x0/0x1/0x100/0x101, PSCI smc, GICv3 3-cell specifiers, 19.2 MHz timebase.", "GIC distributor 0x9bc0000, redistributors 0x9c00000; EL1 physical timer PPI 14 in the device tree, i.e. GIC INTID 30."]
configuration = ["cpu0 enabled in stage 1; cpu1..cpu3 disabled until the GIC 3-cell check passes.", "PcdArmArchTimer{Sec,Intr,Virt,Hyp}IntrNum = 29/30/27/26 (GIC INTIDs) on top of the 19.2 MHz PcdTimerFreqOverwrite."]
procedure = ["Build with cpu0-only; enable secondaries one at a time; verify IPI/timer per core."]
findings = [
  "Timer interrupts were registered on the wrong INTIDs, and that single defect explains both observed symptoms. ArmPkg declares PcdArmArchTimer{Sec,Intr,Virt,Hyp}IntrNum as GIC INTIDs (defaults 29/30/26/27) and TimerDxe.c passes the PCD straight to RegisterInterruptSource() with no +16; Msm8996Pkg.dsc.inc carried 13/14/11/10, which is the device-tree PPI index. PPI 13/14 map to INTID 29/30, so the handler sat on SGI 13/14 while the EL1 physical timer raised INTID 30. TimerInterruptHandler therefore never ran, mTimer.Ticks never advanced, and every EVT_TIMER consumer stalled at once: the BDS countdown froze at 10 s and KeypadDxe's 20 ms debounce/repeat never fired, so the panel showed a frozen countdown and the keys looked dead. PcdTimerFreqOverwrite had already been fixed to 19200000 and was confirmed present in AutoGen.c while the symptom did not change — the frequency was never the cause.",
  "The PPI-vs-INTID question is decidable offline, before a flash. Disassembling the built TimerDxe image shows the four PCD values as immediates: v99 carried mov w20,#0xe / w21,#0xd / w1,#0xb / w22,#0xa (14/13/11/10), v100 carries #0x1e / #0x1d / #0x1b / #0x1a (30/29/27/26). This is the cheapest acceptance test for any change to these PCDs.",
  "Do not copy the other Qualcomm platforms in Mu-Silicium. Hana, Rennell, Nazgul, Starlord, Strait, Napali and Kamorta all set PcdArmArchTimerSecIntrNum|17 and PcdArmArchTimerIntrNum|18 (PPI 1/2, neither the ARM standard nor the 8996 mapping), and Strait additionally sets VirtIntrNum 30. Those are further instances of the same mistake; ArmPkg.dec's own defaults are the only correct reference in this tree.",
  "The vendor firmware uses the generic ArmPkg timer on this SoC, which is what makes the standard mapping applicable. The QFIL xbl.elf contains ArmGicDxe (DE371F7C-DEC4-4D21-ADF1-593ABCC15882) and TimerDxe (F099D67F-71AE-4C36-B2A3-DCEB0EB2B7D8), and the debug strings in those images still carry the source path MSM8996_1031/boot_images/ArmPkg/Library/ArmArchTimerLib/ArmArchTimerLib.c. There is no vendor-private msm8996 timer driver to reconcile against.",
  "The device tree and Linux agree with the standard mapping: msm8996.dtsi declares interrupts = <1 13 8>, <1 14 8>, <1 11 8>, <1 10 8>, i.e. PPIs 13/14/11/10, and the stock Linux kernel drives the same timer on INTID 29/30/27/26.",
]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["GICv3 3-cell specifier support in ArmCpu still unverified: cpu1..cpu3 stay disabled until it is.", "The timer fix is built into v100 but has not yet been observed on hardware; the last flashed image (v98) predates it."]
next_action = ["Flash v100 and read the menu: an advancing countdown and live keys confirm the fix; if the countdown still stalls, the v99 diagnostic line already reports CPU/HW/IRQ/TMR/PCT so the failing layer is visible."]
evidence = [
  "board.dts cpu nodes: compatible 'arm,cortex-a72','qcom,kryo'; reg <0 0x0>/<0 0x1>/<0 0x100>/<0 0x101>; enable-method 'qcom,psci'.",
  "ArmPkg/ArmPkg.dec:270-275 declares the four PcdArmArchTimer*IntrNum PCDs with defaults 29/30/26/27 and documents them as GIC PPI numbers.",
  "ArmPkg/Drivers/TimerDxe/TimerDxe.c:394 reads PcdGet32 (PcdArmArchTimerIntrNum) and calls RegisterInterruptSource with that value unchanged; ArmPkg/Drivers/ArmGicDxe/GicV3/ArmGicV3Dxe.c routes only INTID >= 16 through the GICR path.",
  "llvm-objdump -d on AARCH64/ArmPkg/Drivers/TimerDxe/TimerDxe/DEBUG/ArmTimerDxe.dll before and after the change: 0xe/0xd/0xb/0xa -> 0x1e/0x1d/0x1b/0x1a.",
  "workspace/tmp/xbl-extract/volume-0/file-9e21fd93-.../section0/section1/volume-ee4e5898-.../file-f099d67f-.../section1.pe is the vendor TimerDxe; the same directory holds the vendor ArmGicDxe.",
  "docs/timer-ppi-finding.md records the full derivation, the counter-evidence from the other Qualcomm platforms and the vendor-firmware cross-check.",
]

[[area]]
id = "memory"
status = "in-progress"
components = ["ArmSmmu4K"]
paths = ["dts/msm8996.dtsi", "dts/g0245d.dts"]
inputs = [
  "DRAM 4 GB at 0x80000000; stock reserved-memory from board.dts: removed_regions@85800000 0x3000000 (48 MB), modem_region@88800000 0x6200000 (98 MB), peripheral_region@8ea00000 0x2b00000 (43 MB, slpi), dfps_data_mem@83400000 0x1000, cont_splash_mem@83401000 0x23ff000 (36 MB), cont_splash_mem_hdmi@b1c00000 0x23ff000; shared pools: adsp 4 MB, qseecom 0x1400000 (20 MB), secure 0x5c00000 (92 MB).",
  "xbl.elf program headers (17 segments): XBL/TZ core resident at 0x6208000-0x66b4400 (low DDR, below the DRAM base) and 0x85e00000-0x85ec9a08 (inside removed_regions); DDR training scratch 0x80200000-0x81100000 (transient); IMEM 0x207000-0x219970.",
  "aboot resident image 0x91600000-0x916c4478 (emmc_appsboot.mbn main segment, entry 0x91600000); aboot is still running when BootShim starts.",
  "BootShim handoff: kernel image window 0x80008000-0x81c03570 (decompressed shim+FD + stock kernel BSS top); tags 0x80000100; boot header read scratch 0x8F6FF000 inside peripheral_region.",
  "smmu-v2 at 0xb40000 (adreno_smmu); GPU carveout to be read from the XBL memory map.",
]
configuration = ["Board DTS carries the contiguous DRAM range; ADT memory-map placeholders come from the generator.", "UniXNU FD placement fixed: FD_BASE=0x92000000, FD_SIZE=0x300000, in the free window 0x916c4478-0xb1c00000 (about 508 MB) above the aboot image and below cont_splash_mem_hdmi; recorded as unixnu_fd_region in dts/g0245d.dts.", "Dynamic pools pinned at 0x178c00000-0x180000000 (116 MB from the top of 4 GB) so the layout matches the stock kernel carve."]
procedure = ["Compare firmware RAM map, carveouts, framebuffer and payload allocations; record SMMU context ownership per DMA device."]
findings = [
  "Collect the first handoff-region observation from the UEFI memory map.",
  "Free-window derivation: every firmware-owned DDR consumer at BootShim entry is below 0x916c4478 (XBL/TZ 0x85e00000-0x85ec9a08, modem 0x88800000-0x8ea00000, peripheral 0x8ea00000-0x91500000, aboot 0x91600000-0x916c4478) or above 0xb1c00000 (hdmi splash 0xb1c00000-0xb3fff000). The dynamic pools are carved by the Linux kernel, which never runs, so they are free at handoff; UniXNU pins them at the top of RAM instead.",
  "XBL/UEFI memory map (xbl.elf string table, 32 entries; embedded __FILE__ path QcomPkg/XBLCore/UefiPlatCfg.c confirms it is the authoritative XBL memory map) resolves the firmware carveouts: HLOS 0 0x80100000-0x80200000, XBL's own UEFI FD 0x80200000-0x80300000, Display Reserved 0x80400000-0x80C00000 (8 MB, XBL early framebuffer, WRITE_THROUGH), HLOS 2 0x84000000-0x85800000, HYP 0x85800000-0x85E00000, SMEM 0x86000000-0x86200000, TZ_STAT 0x86200000-0x86300000, TAGS 0x86300000-0x86400000, TZ 0x86400000-0x86600000, Stargate (CPU DFD) 0x87400000-0x88800000, PIL_REGION 0x88800000-0x90F00000 (135 MB = modem/ADSP/venus/MBA/wlan). The XBL map has NO separate fixed GPU (Adreno) carveout — GPU memory is carved at runtime via KGSL/PIL inside PIL_REGION; the 'GPU/venus/mba carveout' open item is therefore closed (venus/MBA live inside PIL_REGION; GPU is dynamic).",
  "Free-window reconciliation against the XBL map: PIL_REGION ends at 0x90F00000 and aboot starts at 0x91600000, so the gap 0x90F00000-0x91600000 (~7 MB) plus 0x916c4478-0xb1c00000 are free at BootShim entry. FD_BASE=0x92000000 sits inside that upper free window (above aboot, below hdmi splash 0xb1c00000), confirmed consistent with the XBL memory map. cont_splash_mem@0x83401000 (36 MB, the GOP handoff framebuffer) lies inside the XBL-free band 0x80C00000-0x84000000 (between Display Reserved and HLOS 2) and is owned by the ABL/Linux, not XBL.",
]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["GPU carveout is dynamic (no fixed region in the XBL map); if UniXNU's Adreno530 needs a static reserved range, derive it from KGSL/Linux board.dts at enablement time rather than the XBL map.", "The 0x92000000 FD window is confirmed clear of aboot's decompression target (kernel_addr 0x80008000, per Ghidra) and of every XBL carveout (PIL_REGION ends 0x90F00000, aboot 0x91600000-0x916c4478, hdmi splash 0xb1c00000)."]
next_action = ["Capture the XBL/UEFI memory map from the extracted xbl.elf and reconcile against the DTS carveouts; verify the aboot decompression destination in Ghidra before locking FD_BASE."]
evidence = [
  "board.dts reserved-memory node transcribed verbatim into porting.toml inputs.",
  "xbl.elf: 17 program headers parsed; LOAD segments cover 0x6208000/0x625f000/0x626a000/0x6680000/0x6683000/0x66a2000 (low), 0x85e00000/0x85e80000/0x85eb0000/0x85ec0000 (high, inside removed_regions), 0x80200000 (DDR training 0xf0000), IMEM 0x21e000/0x207000/0x217800/0x219800.",
  "emmc_appsboot.mbn MBN parse: entry 0x91600000, main segment file 0x8000..0xb907c -> 0x91600000..0x916b907c.",
  "boot.img v0 header: kernel_addr 0x80008000 confirmed by vmlinux entry 0xffffffc000080000 (PHYS_OFFSET 0x80000000).",
]

[[area]]
id = "storage"
status = "in-progress"
components = []
