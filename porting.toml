[[area]]
id = "packaging"
status = "complete"
components = []
paths = ["scripts/package-g0245d-boot.py", "board.toml"]
inputs = [
  "Android boot image v0 header from the stock boot.img (scripts/extract-files.py): kernel_addr 0x80008000, ramdisk_addr 0x81000000, tags_addr 0x80000100, page_size 4096, kernel 39343981 B, ramdisk 7778033 B.",
  "Stock cmdline (v0 header, offset 64): 'console=ttyHSL0,115200,n8 androidboot.console=ttyHSL0 androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 cma=32M@0-0xffffffff'.",
  "Mu-Silicium msmoot image config; payload volume G0245D 192 MiB inside userdata (LBA 74312..14526452).",
]
configuration = ["[bootimg] dtb_node carries the real cont_splash_region 0x83401000/0x23ff000 for the stock bootloader."]
procedure = ["Pack the boot image; verify header, ramdisk_bytes and DTB round-trip; flash with fastboot."]
findings = [
  "Boot chain on G0245D is LK-based (not UEFI): xbl.elf -> emmc_appsboot.mbn (aboot) -> boot.img. BootShim therefore replaces the boot.img kernel slot; aboot still parses the ANDROID! header, verifies the image (boot_verifier.c / VERIFIED_BOOT_SIG) and patches the DTB chosen/bootargs before jumping to the kernel entry.",
  "aboot DTB strings confirm it supports appended-DTB boot.img variants and moves/resizes the dtb buffer, so the BootShim image can carry a DTB for the UEFI stage.",
  "Stock boot.img kernel slot is gzip(ARM64 Image) + FDT appended with no gap: gzip stream 8399161 B decompresses to a 26375904 B Image (text_offset 0x80000 — CORRECTED from the earlier 0x0 note; image_size 0x1b88000, magic 'ARMd', code0 0x91005a4d), immediately followed by a 341047 B FDT byte-identical to the standalone board.dtb. Real kernel text sits at 0x80008000+0x80000=0x80088000, clear of the appended-DTB region 0x80000100-0x800536F7. The appended-DTB path is therefore already proven on this aboot: UniXNU packs gzip(BootShim+FD)+DTB the same way.",
  "Ghidra raw-binary analysis of emmc_appsboot.mbn (base 0x91600000, image file[0x8000:], pyghidra decompilation of FUN_91635204 = boot-from-mmc and FUN_91634f74 = boot_linux jump) answers the BootShim five-question contract: (1) GZIP TARGET — gunzip output is memcpy'd to kernel_addr 0x80008000 via FUN_916484e0 (memcpy); (2) APPENDED-DTB COPY — FUN_9161981c matches one of the 90 FDTs by qcom,msm-id/board-id/pmic-id and memcpy's it to tags_addr 0x80000100 (same dest for both the dtb_size==0 appended path and the QCDT path); a 'Tags addresses overlap with aboot' guard exists but protects only the aboot image, not the kernel window; (3) JUMP CONTRACT — FUN_91634f74 patches the DTB (update_device_tree), checks *(kernel+0x38)=='ARMd', builds a TZ-handoff struct (_DAT_916b7000: +0x00 DTB/tags_addr, +0x48 kernel_entry), then issues an SCM call (FUN_9161b2bc scm cmd=(1<<10)|0xf, or FUN_9161b508 scm_call id=0x200010f); TrustZone sets x0=DTB and jumps to kernel_entry=0x80008000; aboot never returns (a return prints 'Failed to jump to kernel'); the 32-bit fallback is (*entry)(0, dtb, x2); (4) ARM64 HEADER CHECK — double-validated: FUN_91635204's FUN_91633e50(0x916b9b80, *(img+0x38)==0x644d5241) and FUN_91634f74's `if(*(int*)(kernel+0x38)==0x644d5241)`; BootShim MUST keep a valid ARM64 header with the 'ARMd' magic; (5) boot_verifier GATING — at DAT_9168da00==1 (unlocked) FUN_9160f7cc returns success immediately; FUN_91635160 prints 'Device is unlocked! Skipping verification...' and mdelay(5000); gating is PATH A (skip sig verify) iff unlocked && _DAT_916b8af4==0, else PATH B (FUN_91633d24). PATH B failures are NON-FATAL (print only; _DAT_916b8b00 set; 'androidboot.authorized_kernel=false' appended to cmdline by FUN_9163436c) and never block a normal boot (fastboot_flag==0). Conclusion: a locked retail G0245D with an unsigned boot.img still boots (errors printed, launch not blocked); an unlocked device skips verification entirely.",
  "Header address fixup (FUN_91633e50) passes kernel_addr/ramdisk_addr/tags_addr through a memory-map identity translation for DDR (FUN_91603c1c reads the 64-bit base 0x916b2528 = 0x80000000 for the 4 GB part; DDR addresses map to themselves), so the effective load addresses remain 0x80008000 / 0x81000000 / 0x80000100 — consistent with the v0 header and safe for FD_BASE=0x92000000 (above aboot 0x916c4478, below hdmi splash 0xb1c00000; aboot decompresses only into 0x80008000, never into the FD window).",
  "BootShim entry state: aboot decompresses the gzip stream to kernel_addr 0x80008000 (vmlinux entry 0xffffffc000080000 confirms PHYS_OFFSET 0x80000000) and jumps there with x0 pointing at the appended DTB at tags_addr 0x80000100. The decompressed image starts with the ARM64 header, so the shim must keep REQUIRES_KERNEL_HEADER=1 semantics with a valid head.S-style code0 branch.",
  "BootShim.S WRITTEN (uefi-g0245d/BootShim/BootShim.S) implements this exact contract: REQUIRES_KERNEL_HEADER=1 emits the ARM64 head (code0 `b` to real entry, +0x38 magic 0x644d5241, +0x08 = FD_BASE 0x92000000, +0x10 = len(shim)+FD_SIZE); runtime preserves x0=DTB, relocates the firmware volume from (load+shim_size) to FD_BASE 0x92000000 and branches to the UEFI SEC entry. clang --target=aarch64-none-elf compiled it to a 120-byte shim.o that passes every package-g0245d-boot.py assertion (ARM\\x64 magic, header fields, _Payload at end).",
]
completion = ["BootShim stage 1 implemented and the boot image packs end-to-end: gzip(120-byte shim + 0x300000 FD) + single appended DTB, v0 header round-trip, gzip/FD/DTB round-trip, 16384 B container within the 64 MiB boot partition. Repeated flashes on hardware (v97, v98) boot into the UniXNU menu, so aboot accepts the container as the Ghidra contract predicted."]
limits = [
  "Stock bootloader unlock state confirmed by Ghidra: a locked retail G0245D boots an unsigned boot.img (boot_verifier errors are non-fatal); unlock (fastboot oem unlock, writes DAT_916902f4) skips verification entirely. QFIL/E DL remains the flashing/bypass path if the boot partition is write-protected.",
  "The stock cmdline requests cma=32M and lpm_levels.sleep_disabled=1; UniXNU supplies its own cmdline, so these are informational only.",
  "BootShim code at kernel_addr 0x80008000 must avoid the appended-DTB region 0x80000100-0x800536F7; it is placed above it, so the default layout is safe. FD_BASE=0x92000000 is confirmed clear of aboot's decompression target.",
  "The FD is no longer a placeholder: SILICIUM_UEFI.fd is 3145728 bytes, byte-exact against [uefi_fd] size, and contains the real UniXNU/DarwinBoot payload. A build-time timestamp means two builds of identical sources produce different image md5s, so release checks compare the FD content (scripts/verify-fd-unixnu.py) and never the md5 alone.",
  "AVB: `fastboot boot` on this aboot prints an `avb footer` warning and proceeds; it is not a failure signal.",
]
next_action = ["Flash v100 and confirm the countdown advances. Every image from here on goes through scripts/flash-linux.sh, which pins the expected md5, refuses to overwrite a known older image and checks the ANDROID! magic before writing."]
evidence = [
  "boot.img v0 header parsed; cmdline at offset 64 (name[16]+unused[2] precede it).",
  "boot.img kernel slot: zlib decompressobj(31) -> 26375904 B Image + unused_data starting d0 0d fe ed (FDT totalsize 341047), byte-identical to board.dtb.",
  "boot.img DTB table: 90 concatenated FDTs (each 330177-349324 B, totals 30944820 B, no index header) after the gzip stream; FDT#0 == board.dtb; root ids qcom,msm-id=<0xf6 0x30000>, qcom,board-id=<0x03 0x00>, qcom,pmic-id=<0x20009 0x2000a 0x00 0x00>.",
  "vmlinux ELF64 LOAD segments: entry 0xffffffc000080000, phys 0x80008000-0x81c03570.",
  "emmc_appsboot.mbn strings: boot_verifier.c, VERIFIED_BOOT_SIG, 'Failed to jump to kernel', 'Cannot update chosen node [bootargs]', ANDROID! @0x7e168; aboot partition mapping from rawprogram XML.",
  "scripts/package-g0245d-boot.py end-to-end validated: real 120-byte BootShim (clang, REQUIRES_KERNEL_HEADER=1) + 0x300000 FD (placeholder) -> gzip(shim+FD)+DTB container; v0 header round-trip, gzip/FD/appended-DTB round-trip, 16384 B container inside the 64 MiB boot partition; g0245d-uefi.img written to build/g0245d/boot/.",
  "Ghidra raw-binary analysis of emmc_appsboot.mbn (pyghidra, base 0x91600000, image file[0x8000:], analyze=False on the existing project at /tmp/test-proj-arm32): decompiled FUN_91635204 (boot-from-mmc: read boot.img -> gunzip to buffer tail -> FUN_916484e0 memcpy to kernel_addr 0x80008000 -> FUN_9161981c DTB match -> memcpy to tags_addr 0x80000100 -> FUN_91633e50 header fixup), FUN_91634f74 (boot_linux: update_device_tree -> 'ARMd' check at +0x38 -> SCM call FUN_9161b2bc scm cmd (1<<10)|0xf / FUN_9161b508 id 0x200010f -> TZ jumps kernel_entry with x0=DTB), and the boot_verifier gate (FUN_9160f7cc / FUN_91635160 / FUN_91633d24 / FUN_9163436c); xref/string scans over 102515 instructions across 725116 B.",
]

